services:
  server:
    build: .
    container_name: devburgerapi-server
    ports:
      - "127.0.0.1:8391:3001"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DB_HOST=db
      # Continua "mongo:27017" porque essa é a porta INTERNA do container,
      # dentro da rede Docker (não muda com o remapeamento de porta externa abaixo).
      - MONGO_URL=mongodb://mongo:27017/devburguer
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started

  db:
    image: postgres:15-alpine
    container_name: devburgerapi-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_DB=dev-burger-db
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
      - TZ=America/Sao_Paulo
      - PGTZ=America/Sao_Paulo
    ports:
      - "127.0.0.1:6547:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    secrets:
      - db-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dev-burger-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: devburguer-mongo
    restart: always
    ports:
      - "127.0.0.1:29841:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:

secrets:
  db-password:
    file: ./db/password.txt