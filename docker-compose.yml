services:
  server:
    build: .
    container_name: devburgerapi-server
    ports:
      - "3001:3001"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DB_HOST=db
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: devburgerapi-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_DB=dev-burger-db
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
      - TZ=America/Sao_Paulo
      - PGTZ=America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    secrets:
      - db-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dev-burger-db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

secrets:
  db-password:
    file: ./db/password.txt
